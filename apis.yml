name: TPP (SystmOne)
kind: company
description: >-
  TPP (The Phoenix Partnership) is a UK healthcare software company founded in 1997 and
  headquartered in Leeds, England. Its flagship clinical system, SystmOne, is one of the
  two dominant GP electronic health record platforms in England (alongside EMIS Web) and
  holds more than 61 million patient records shared across the NHS, serving over 300,000
  users and 7,800+ organisations spanning general practice, hospitals, urgent care, mental
  health, community, and social care. TPP does not operate a public self-serve developer
  portal; integration is a gated, partner-conformance process. Third parties integrate with
  SystmOne through NHS England's Interface Mechanism 1 (IM1 Transaction, Bulk, and Patient
  Facing Services APIs) and the national GP Connect FHIR programme, both governed by the
  Digital Care Services (DCS) framework and a Supplier Conformance Assessment List (SCAL)
  approved by NHS England. TPP additionally publishes its own downloadable interface
  specifications - the SystmOne Client Integration API (XML over a TCP socket), a Patient
  Facing Services (PFS) API, a Generic HTML API, and a Telephony API - and a formal
  Integration Request process. Home market is the United Kingdom, exclusively within the NHS.
