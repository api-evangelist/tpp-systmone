apis:
- aid: tpp-systmone:systmone-client-integration-api
  name: SystmOne Client Integration API
  description: >-
    TPP's local client-integration interface allowing an approved third-party application to
    interact with a running SystmOne client. Communication is performed with XML documents
    (validated against published XSD schemas) sent and received over a TCP socket connection.
    Documented functions include GetFunctions, GetOrganisationMetaData, GetCurrentActivity,
    GetCurrentSelection, PatientSearch, GetPatientRecord, UpdatePatientRecord, GetDocument,
    DeleteFromPatientRecord, GetAppointmentSlots, GetDiary, DataExtract, LaunchFunctionality,
    and ExitClient. Access requires TPP's Integration Request approval.
  humanURL: https://tpp-uk.com/resources/integration-request/
  tags:
  - Integration
  - EHR
  - Clinical System
  - XML
  properties:
  - type: Documentation
    url: https://tpp-uk.com/resources/integration-request/
  - type: Specification
    url: schemas/SystmOne-Client-Integration-API-v33.4.pdf
  - type: Schema
    url: schemas/schemas/
  - type: ExampleMessages
    url: schemas/example-messages-2.zip
- aid: tpp-systmone:systmone-pfs-api
  name: SystmOne Patient Facing Services (PFS) API
  description: >-
    TPP's Patient Facing Services API, enabling patient-facing applications to interact with
    SystmOne for services such as appointment booking, prescription requests, and record
    access. Distributed as a downloadable specification package (spec PDF plus example
    messages). Access requires TPP's Integration Request approval and NHS conformance.
  humanURL: https://tpp-uk.com/resources/integration-request/
  tags:
  - Patient Facing Services
  - Appointments
  - Prescriptions
  properties:
  - type: Documentation
    url: https://tpp-uk.com/resources/integration-request/
  - type: Specification
    url: schemas/PFS-API.zip
