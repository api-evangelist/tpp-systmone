- aid: tpp-systmone:im1-interface-mechanism-1
  name: Interface Mechanism 1 (IM1)
  description: >-
    The NHS England national integration route by which approved third-party applications
    connect directly to GP clinical systems including TPP SystmOne. IM1 comprises the
    Transaction API (real-time read/write, e.g. appointment booking and structured record
    updates), the Bulk API (Strategic Reporting Extracts / aggregated data extraction), and
    the Patient Facing Services API. Onboarding is via the Digital Care Services IM1 Pairing
    Integration Process and a Supplier Conformance Assessment List (SCAL) approved by NHS
    England. Standards are published in the NHS England developer API catalogue, not on a
    TPP-hosted portal.
  humanURL: https://digital.nhs.uk/developer/api-catalogue/interface-mechanism-1-standards
  tags:
  - IM1
  - National Health System
  - Interoperability
  - EHR
  properties:
  - type: Documentation
    url: https://digital.nhs.uk/services/digital-services-for-integrated-care/im1-pairing-integration
  - type: APIReference
    url: https://digital.nhs.uk/developer/api-catalogue/interface-mechanism-1-standards
- aid: tpp-systmone:gp-connect
  name: GP Connect (FHIR)
  description: >-
    GP Connect is NHS England's national FHIR-based interoperability programme. TPP SystmOne
    clinical records are exposed through GP Connect's FHIR API for authorised record viewing,
    appointment management, and structured record access across care settings. FHIR
    CapabilityStatements and endpoints are provisioned per-practice through the NHS Spine and
    the Digital Care Services framework - there is no single TPP-hosted FHIR base URL or
    public /metadata endpoint. Security uses NHS-issued JWT (cross-organisation audit and
    provenance) over the Spine Security Proxy, not open SMART-on-FHIR.
  humanURL: https://digital.nhs.uk/services/gp-connect
  tags:
  - FHIR
  - GP Connect
  - Interoperability
  - National Health System
  - HL7
