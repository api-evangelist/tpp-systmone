  type: Announcement
  note: TPP announcement that SystmOne records are available via GP Connect FHIR for authorised record viewing.
actions:
  apisYmlUpdated: true
  specsSaved: 6
  reason: |
    Captured a real (gated) integration surface: the TPP Integration Request
    portal plus six verbatim downloadable specification artifacts (XML/XSD +
    PDFs), and modelled the national IM1 and GP Connect FHIR routes. No OpenAPI
    and no TPP-hosted FHIR CapabilityStatement exist, so none were fabricated.
